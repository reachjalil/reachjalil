<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="title">
<title id="title">Jev Logs: Scores OpenTelemetry logs before an expensive LLM sees them. Every record is kept; only the signal gets analyzed.</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x=".5" y=".5" width="419" height="149" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="22" y="32" class="mono" font-size="11" letter-spacing=".6" fill="#6e7781">OPENTELEMETRY · LLM COST</text>
<text x="22" y="58" font-size="19" font-weight="700" fill="#1f2328">Jev Logs</text>
<text x="398" y="58" text-anchor="end" font-size="16" fill="#6e7781">↗</text>
<text x="22" y="84" font-size="13.5" fill="#59636e">Scores OpenTelemetry logs before an expensive LLM sees</text>
<text x="22" y="104" font-size="13.5" fill="#59636e">them. Every record is kept; only the signal gets analyzed.</text>
<g transform="translate(22 128)">
<circle cx="5" cy="0" r="5" fill="#f1e05a"/>
<text x="15" y="4" font-size="12.5" fill="#59636e">JavaScript</text>
<text x="94.3" y="4" font-size="12.5" fill="#59636e">★ 13</text>
<text x="136.3" y="4" font-size="12.5" class="mono" fill="#59636e">npx jevlogs</text>
</g>
</svg>
