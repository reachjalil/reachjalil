<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title">
<title id="title">Jalil Laaraichi. Infrastructure for AI agents that do real work, and the product that makes it feel simple.</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.wire { fill: none; stroke: #3d444d; stroke-width: 1.5; }
.flow { fill: none; stroke: #4493f8; stroke-opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 8; animation: flow 1.4s linear infinite; }
.flow.in { animation-direction: reverse; }
.packet { fill: none; stroke: #4493f8; stroke-width: 5; stroke-linecap: round; stroke-dasharray: .6 99.4; animation: travel 3s linear infinite; }
.node { fill: #151b23; stroke: #3d444d; }
.halo { fill: none; stroke: #4493f8; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
.live { animation: live 2s ease-in-out infinite; }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
@keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
@keyframes halo { 0% { transform: scale(1); opacity: .6; } 80%, 100% { transform: scale(1.8); opacity: 0; } }
@keyframes live { 50% { opacity: .35; } }
@keyframes blink { 50% { fill-opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4493f8"/><stop offset="1" stop-color="#ab7df8"/></linearGradient>
<radialGradient id="glow" cx="725" cy="150" r="150" gradientUnits="userSpaceOnUse" gradientTransform="translate(725 150) scale(1.3 0.95) translate(-725 -150)"><stop offset="0" stop-color="#4493f8" stop-opacity=".16"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/></radialGradient>
<radialGradient id="fade" cx="725" cy="150" r="200" gradientUnits="userSpaceOnUse" gradientTransform="translate(725 150) scale(1.2 0.78) translate(-725 -150)"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3d444d"/></pattern>
<mask id="grid"><rect width="900" height="300" fill="url(#fade)"/></mask>
</defs>
<rect width="900" height="300" fill="url(#dots)" mask="url(#grid)"/>
<rect width="900" height="300" fill="url(#glow)"/>
<g transform="translate(32 38)">
<rect width="176.6" height="28" rx="14" fill="#4493f8" fill-opacity=".08" stroke="#4493f8" stroke-opacity=".35"/>
<circle cx="16" cy="14" r="4.5" fill="#3fb950" class="live"/>
<text x="30" y="18.5" class="mono" font-size="13" fill="#f0f6fc">building OpenWork</text>
</g>
<text x="32" y="126" font-size="48" font-weight="700" letter-spacing="-1" fill="#f0f6fc">Jalil Laaraichi</text>
<text x="32" y="170" font-size="20" fill="#f0f6fc">Infrastructure for AI agents that do real work,</text>
<text x="32" y="198" font-size="20" fill="#9198a1">and the product that makes it feel simple.</text>
<text x="32" y="262" class="mono" font-size="13" fill="#9198a1"><tspan fill="#3fb950">$</tspan> <tspan fill="#f0f6fc">ship</tspan> <tspan fill="#4493f8">--small --tested --documented</tspan><tspan class="cursor" fill="#f0f6fc">▍</tspan></text>
