<path d="M725 150L846.2 200" class="wire"/>
<path d="M725 150L846.2 200" class="flow"/>
<path d="M725 150L846.2 200" pathLength="100" class="packet" style="animation-duration:3.6s;animation-delay:-1.4s"/>
<path d="M725 150L725 250" class="wire"/>
<path d="M725 150L725 250" class="flow in"/>
<path d="M725 250L725 150" pathLength="100" class="packet" style="animation-duration:2.6s;animation-delay:-2.1s"/>
<path d="M725 150L603.8 200" class="wire"/>
<path d="M725 150L603.8 200" class="flow"/>
<path d="M725 150L603.8 200" pathLength="100" class="packet" style="animation-duration:3.1s;animation-delay:-2.8s"/>
<path d="M725 150L603.8 100" class="wire"/>
<path d="M725 150L603.8 100" class="flow in"/>
<path d="M603.8 100L725 150" pathLength="100" class="packet" style="animation-duration:3.6s;animation-delay:-3.5s"/>
